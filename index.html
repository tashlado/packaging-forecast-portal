<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
/* Design system shared with the Postage Forecast Portal — same tokens, same
   components, so the two portals read as one product. Keep the two in step. */
:root{
  --brand:#0000FF; --brand-lo:#0000C2; --brand-tint:#F0F0FF;
  --ink:#0B0B0F; --ink-2:#3F4451; --ink-3:#6B7280;
  --line:#E4E6EC; --line-2:#C8CBD4;
  --bg:#F7F8FA; --surface:#FFFFFF;
  --ok:#0F8A5F; --warn:#B8730A; --err:#C6273E;
  --radius:8px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg); color:var(--ink); font-size:14px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
.num{font-variant-numeric:tabular-nums}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select{font:inherit;color:inherit}
a{color:var(--brand)}

/* ---- header ---- */
header{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.hrow{display:flex;align-items:center;gap:20px;padding:10px 20px;max-width:1400px;margin:0 auto}
.logo{height:22px;width:auto;display:block}
/* Beside the logo, on its baseline — not stacked. Reuses the active nav tab's
   13px/500 and --ink rather than introducing a title style, and sits inside
   .hlogo so the flex gap between logo and name is tighter than the header's. */
.hlogo{display:flex;align-items:center;gap:9px}
.hlogo .pname{font-size:13px;font-weight:500;color:var(--ink);white-space:nowrap}
/* overflow:hidden, not auto: the row must never grow a scrollbar, and scrollWidth
   against clientWidth is how fitNav decides what to collapse. The More menu lives
   outside nav for that reason — inside, overflow:hidden would clip it. */
nav{display:flex;gap:2px;flex:1;min-width:0;overflow:hidden}
nav button,.navmore>button{padding:7px 11px;font-size:13px;color:var(--ink-3);
       border-radius:6px 6px 0 0;white-space:nowrap}
nav button:hover,.navmore>button:hover{color:var(--ink);background:var(--bg)}
nav button.on,.navmore>button.on{color:var(--ink);font-weight:500;
       box-shadow:inset 0 -2px 0 var(--brand)}
nav [hidden]{display:none}
nav.scrolls{overflow-x:auto}
.navmore{position:relative;flex:0 0 auto}
.navmore[hidden]{display:none}
.navmenu{position:absolute;top:calc(100% + 4px);left:0;min-width:170px;z-index:30;
       background:var(--surface);border:1px solid var(--line);border-radius:10px;
       box-shadow:0 12px 32px rgba(11,11,15,.16);padding:4px;display:flex;
       flex-direction:column;gap:2px}
.navmenu[hidden]{display:none}
.navmenu button{text-align:left;padding:7px 10px;font-size:13px;border-radius:7px;
       color:var(--ink-2);white-space:nowrap}
.navmenu button:hover{background:var(--bg);color:var(--ink)}
.navmenu button.on{color:var(--ink);font-weight:500;background:var(--brand-tint)}
.hright{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--ink-3);white-space:nowrap}
/* One chip, never two: a write in flight or a failed write wins over the resting
   recalculation state, because it is the more urgent and the more perishable. */
.chip{border-radius:10px;padding:2px 9px;font-size:11px;white-space:nowrap;
      background:var(--bg);color:var(--ink-3);border:1px solid transparent}
.chip.green{background:#E7F5EF;color:var(--ok)}
.chip.amber{background:#FFF4E0;color:var(--warn)}
.chip.err{background:#FDEBED;color:var(--err)}
.avatar{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;
      border-radius:50%;background:var(--brand-tint);color:var(--brand-lo);
      font-size:11px;font-weight:500;letter-spacing:.02em;cursor:default}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.badge{background:var(--brand-tint);color:var(--brand-lo);border-radius:10px;padding:1px 8px;font-size:11px}
.badge.amber{background:#FFF4E0;color:var(--warn)}
.badge.err{background:#FDEBED;color:var(--err)}
.badge.green{background:#E7F5EF;color:var(--ok)}

/* ---- layout ---- */
main{max-width:1400px;margin:0 auto;padding:18px 20px 60px}
.screen{display:none} .screen.on{display:block}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:16px}
.card>h2{font-size:14px;font-weight:500;margin:0;padding:13px 16px;border-bottom:1px solid var(--line)}
.card>h2 .act{float:right;margin-top:-4px}
.card>.body{padding:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}
@media(max-width:900px){.grid2,.grid3{grid-template-columns:1fr}}
.muted{color:var(--ink-3)} .small{font-size:12px}
.right{text-align:right} .mono{font-variant-numeric:tabular-nums}
.stat{font-size:22px;font-weight:500;margin-top:2px}
.stat.sm{font-size:14px;font-weight:500}
.scrollbox{max-height:420px;overflow:auto}
.tablewrap{overflow-x:auto}

/* ---- tables ---- */
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-weight:400;font-size:11px;letter-spacing:.06em;color:var(--ink-3);
   padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:7px 8px;border-bottom:1px solid var(--line)}
tbody tr:last-child td{border-bottom:none}
tbody tr.sel{background:var(--brand-tint)}
tbody tr.click{cursor:pointer}
tbody tr.click:hover{background:var(--bg)}
td.rowacts{white-space:nowrap;text-align:right}
.comment-cell{max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---- controls ---- */
.btn{padding:7px 13px;border-radius:var(--radius);border:1px solid var(--line-2);
     background:var(--surface);font-size:13px;color:var(--ink-2)}
.btn:hover{background:var(--bg)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:var(--brand-lo)}
.btn.danger{color:var(--err);border-color:#F0C9CF}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:4px 9px;font-size:12px}
.btn.link{border-color:transparent;background:none;color:var(--brand);padding:4px 6px;font-size:12px}
.btn.link:hover{background:var(--brand-tint)}
.btn.link.danger{color:var(--err)}
.btn.link.danger:hover{background:#FDEBED}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:11px;color:var(--ink-3);letter-spacing:.04em}
input[type=text],input[type=date],input[type=number],select{
  padding:6px 9px;border:1px solid var(--line-2);border-radius:6px;background:var(--surface);width:100%}
input:focus,select:focus{outline:2px solid var(--brand);outline-offset:-1px;border-color:var(--brand)}
input.bad{border-color:var(--err);background:#FFF6F7}
.row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin-bottom:14px}
.row.tight{margin-bottom:0}
.row .spacer{flex:1}
.filter{min-width:180px;max-width:240px}
.pill{display:inline-block;background:var(--brand-tint);color:var(--brand-lo);
      border-radius:4px;padding:1px 7px;font-size:11px}
.total{display:flex;align-items:center;gap:10px;padding:10px 8px;border-top:2px solid var(--line);
       font-size:13px;font-weight:500}
.total.bad{color:var(--err)} .total.good{color:var(--ok)}
.empty{padding:32px;text-align:center;color:var(--ink-3);font-size:13px}
.err-box{background:#FDEBED;border:1px solid #F0C9CF;color:var(--err);
         padding:10px 12px;border-radius:var(--radius);font-size:13px;margin-bottom:14px}
.ok-box{background:#EAF7F1;border:1px solid #BFE5D5;color:var(--ok);
        padding:10px 12px;border-radius:var(--radius);font-size:13px;margin-bottom:14px}
.warn-box{background:#FFF4E0;border:1px solid #F1DCB2;color:var(--warn);
        padding:10px 12px;border-radius:var(--radius);font-size:13px;margin-bottom:14px}
.spinner{display:inline-block;width:13px;height:13px;border:2px solid var(--line-2);
         border-top-color:var(--brand);border-radius:50%;animation:spin .7s linear infinite;
         vertical-align:-2px;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
.load{padding:60px;text-align:center;color:var(--ink-3)}
.up{color:var(--err)} .down{color:var(--ok)}
.hint{font-size:11px;color:var(--ink-3);margin-top:2px}
.note{font-size:12px;color:var(--ink-3);padding:0 0 10px}

/* ---- modal ---- */
/* fixed, not absolute: the mix editor is long enough to scroll, and a modal opened
   from halfway down a table must not land above the fold. */
.back{position:fixed;inset:0;background:rgba(11,11,15,.42);display:flex;
      align-items:flex-start;justify-content:center;padding:60px 20px 40px;z-index:100;
      overflow:auto}
.modal{background:var(--surface);border-radius:14px;width:100%;max-width:560px;
       box-shadow:0 18px 48px rgba(11,11,15,.22);overflow:hidden}
.modal.wide{max-width:900px}
.modal h3{margin:0;padding:16px 20px 14px;font-size:16px;font-weight:500;
          border-bottom:1px solid var(--line)}
.modal .fields{padding:16px 20px 4px}
.modal .fgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.modal .fgrid .w2{grid-column:span 2} .modal .fgrid .w3{grid-column:span 3}
.modal .fgrid .w4{grid-column:span 4}
@media(max-width:640px){.modal .fgrid{grid-template-columns:1fr 1fr}
  .modal .fgrid .w3,.modal .fgrid .w4{grid-column:span 2}}
.modal .fields .field label{font-size:12px;color:var(--ink-2)}
.modal .hint{font-size:11px;color:var(--ink-3);margin-top:2px}
.modal>.acts{display:flex;align-items:center;justify-content:flex-end;gap:8px;padding:16px 20px;
             border-top:1px solid var(--line);background:var(--bg)}
.modal>.acts .lead{margin-right:auto;font-size:12px}
.modal .mbody{max-height:calc(100vh - 260px);overflow:auto}
.mix-sum-ok{color:var(--ok);font-weight:500;margin-right:12px}
.mix-sum-bad{color:var(--err);font-weight:500;margin-right:12px}

/* ---- multi-select dimension lists (bulk update) ----
   The same component as the Postage Forecast Portal's .checks, under the same
   name on purpose: one dropdown, one style, ported rather than forked. Eight of
   these expanded at once is most of a screen; collapsed, each one says "All 5"
   or "3 of 5", which is the only thing worth knowing until you open it.

   The panel is position:FIXED, and that is not a preference. .modal is
   overflow:hidden and .modal .mbody is max-height + overflow:auto, so an
   absolutely-positioned panel gets clipped by both — it would appear cut off, or
   force the form to scroll to reveal it, which is the pushing-the-form-around
   behaviour the dropdown exists to remove. Fixed escapes both clips, at the cost
   of being placed from script (ckPlace) and re-placed when either scroller moves
   or the window resizes. */
.checks{position:relative}
.checks .cksum{display:flex;align-items:center;gap:8px;width:100%;padding:6px 9px;
       font:inherit;font-size:13px;color:var(--ink-2);text-align:left;cursor:pointer;
       background:var(--surface);border:1px solid var(--line-2);border-radius:6px}
.checks .cksum:hover{border-color:var(--ink-3)}
.checks .cksum:focus-visible{outline:2px solid var(--brand);outline-offset:-2px}
.checks.open .cksum{border-color:var(--brand)}
.checks .cnt{margin-left:auto;font-size:12px;color:var(--ink-3)}
.checks .chev{font-size:10px;color:var(--ink-3);transition:transform .12s}
.checks.open .chev{transform:rotate(180deg)}
.checks .ckpanel{display:none;position:fixed;z-index:110;background:var(--surface);
       border:1px solid var(--line);border-radius:8px;
       box-shadow:0 10px 28px rgba(11,11,15,.18)}
.checks.open .ckpanel{display:block}
.checks .cacts{display:flex;gap:6px;padding:8px 11px 0}
.checks .cacts button{font:inherit;font-size:11px;color:var(--brand);padding:2px 8px;
       border-radius:5px;cursor:pointer;background:none;border:1px solid var(--line)}
.checks .cacts button:hover{background:var(--brand-tint)}
.checks .clist{display:flex;flex-wrap:wrap;gap:3px 10px;padding:8px 11px 10px;
       max-height:164px;overflow:auto}
.checks .clist label{display:flex;align-items:center;gap:6px;font-size:12px;
       color:var(--ink-2);cursor:pointer;min-width:calc(50% - 10px)}
.checks .clist input[type=checkbox]{width:auto;margin:0;flex:none}
/* Nothing ticked is not a narrower selection, it is a selection that matches
   nothing — bulkRequest refuses it, so the control says so before you submit. */
.checks.none .cksum{border-color:var(--err)}
.checks.none .cnt{color:var(--err)}
.kv{width:auto} .kv td{padding:4px 0} .kv td+td{padding-left:18px;text-align:right}
/* A modal's own error slot. showError writes into the screen behind the overlay,
   where a form that stays open would never show you why it refused. */
.modal .merr{margin:0 0 14px;padding:9px 11px;background:#FDEBED;border:1px solid #F0C9CF;
             color:var(--err);border-radius:8px;font-size:13px}
/* Section rule inside a modal — separates the change from the scope it applies to. */
.fsplit{display:flex;align-items:baseline;gap:10px;margin:18px 0 12px;padding-top:14px;
        border-top:1px solid var(--line);font-size:13px;font-weight:500;color:var(--ink)}
.fsplit span{font-weight:400;font-size:11px;color:var(--ink-3)}
</style>
</head>
<body>

<header>
  <div class="hrow">
    <div class="hlogo">
      <img class="logo" alt="HeliosX" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAG4AAAAoCAYAAAAfWs+KAAAEMUlEQVR42u1bQWvUQBT+IvsrCoI9SA9LCWivFby5Qjz06EEoePEgDcVDf0ARD4s0CHqwUOjBY6AWusfSeg8GUfBkQfBP7EI8bLKdHd7MvOzMZhOYBwOdTiYzmW/el/e+zAbw1lIrekLlndR45den9cAVQ6AYS6Xv16fdoPUJ0CK/Pq0FbVZyCbQzgka9dYAiBVC9dYUiX3tvWwntWVFk7j2tPSG+ytteq6NID1yTtMfwlDlvk0EbUqD1AGRC/QbAjmFGCYBtob4LIHf4xCGAE6H+DcAeo61FgAUTAK+A4qXwfwB4eFsPJvP9gslt1DizXwAOVMCPpWKyVLp+4PjJQ+n+qaYta3k4z/CemWdGdSjyjqc011Z5UjAh2GtvCkYwmafQoidt0JLZgp+CB0Omyi5ZDuCjUP/TXvCKHhCcA8UFgKdC4xegkCiz8sQ5OzC9G7tElV1VQBSUqaTIyBRFLpsqB+XCZ8I7KbUEOylLCiA2bIBEGLsaPynbOBYT/U3jUpS5T1Nm0QNwKLVdlJ5KUmQTHpcS9+Z4Up3gJNWAOzaUxLDhTP2zml6XEwm1lay1DOBSxoOrHt4WuIQ5tg68scX8OTJW34WsNSaA0JXMAFxMLG4oLHxqWDwb4Kh0YSB5kmn+iWb+A8V6ccEbCimBtfI/tizyxDPGjsw0Xm4DnLwpQsYz172HvDHjepTpRtZyHZyEADaF+qniulPineLCxI+M5xpF51zRh7I1qX4E4BmArbJc1gtUij6A99IF+7qcjTLXedxjqf4IwDpx3V2pvgFg5GDTcO0vsXGq8a8lML+WQF+XIOWWc31LyFqf6t6EAm7L0OdE8iquB+hs3cGmWXO0+Y4AvJCeMSK8+TMfwMqTikhKxgHg+XTjFrtA8IbrdT2FOqGzmxrAddUelO+6SLMhoxLAHWZgopO1zqaAFlfcHG7ZkldFMSa7dDDWP8dz3ynpdw3AE0y/iGwSACYwfqEglf9K1hK98BAoRvNe2kweN6gfcTnN47hSWcKMPlVqCnPNtMp/pEgLhpzo0nVUOSKCE87CuYoqfwh/39Ncty31yaVUJdOAfySNw6FIhawFADim5bBKqG5OOTG1h4YxbTwuZigjpjwss5w/lXQbZK3iTH3GRA2ea+BChS6ZKKSw2LHklRHqSUIIzqrnjWvOP2HKXISsNSsLyV/L0Co5Iq1q4W2BCxUAUSVcUCDXKEPcA61zVLqQmrKsrwOmBYyZwUmywNcBk9icMgISk1idGCiSCYQJaJougwZyoiqk3hBC/xzN2UAY+3eZNuQL9q/uMdKDhg0A3wlZ6wMd5s8S9J40VjkeTwbztrDZBBv+zOSqQbNQ/udo059cbga0egdavXWeIr2tGrSFTmt5Wz1F+h8hdhC4xn+E6HeDFWiz3Os+gAuh8Vg4zexzsHa/45rNy/4DausdKQEq7hMAAAAASUVORK5CYII=">

<main>
  <div id="boot" class="load"><span class="spinner"></span>Loading&hellip;</div>
  <div id="unauth" class="card" style="display:none"><div class="body">
    <div class="warn-box" style="margin:0">Your account (<span id="unauthEmail"></span>) is not in the
    Permissions tab. Ask an Admin to add you, then reload.</div>
  </div></div>
  <div id="app" style="display:none"><div id="screens"></div></div>
</main>

<script>
/* ============================ state ============================ */
const APP = {
  user:null, ref:null, config:null,
  rates:[], compMix:[], ccMix:[], fx:[], output:[], audit:[], validation:[], completeness:null,
  loadState:'loading', activeTab:'dashboard',
  filters:{ rateBrand:'', rateGeo:'', rateSearch:'', outBrand:'', outGeo:'', outType:'',
            valSeverity:'', valRule:'' }
};
const TABS = [
  {id:'dashboard', label:'Dashboard'},
  {id:'rates',     label:'Rate Card'},
  {id:'compmix',   label:'Component Mix'},
  {id:'ccmix',     label:'Cold Chain'},
  {id:'output',    label:'Output'},
  {id:'validation',label:'Validation'},
  {id:'dims',      label:'Lookups', admin:true},
  {id:'history',   label:'History', admin:true}
];
/* Never collapsed into the More menu, however narrow the window gets. */
const NAV_ALWAYS = ['dashboard','rates','compmix','output'];

/* ====================== header status chip ====================== */
/* Two unrelated facts share one element — whether the last write reached the
   spreadsheet, and whether Output has ever been recalculated. Their writers are
   independent and interleave, so both are state and this is the only thing that
   touches the element. */
let _inFlight = 0, saveState = 'ok', saveMsg = '';
function setSave(state, msg){ saveState = state; saveMsg = msg || ''; renderStatusChip(); }
function renderStatusChip(){
  const el = document.getElementById('status');
  if(!el) return;
  let cls = 'chip', text, tip;
  if(saveState === 'busy'){
    text = 'Saving…'; tip = 'Writing to the spreadsheet';
  } else if(saveState === 'err'){
    cls += ' err'; text = 'Not saved'; tip = saveMsg || 'The last change did not save.';
  } else if(APP.loadState === 'unauth'){
    cls += ' amber'; text = 'No access'; tip = 'This account is not in the Permissions tab.';
  } else if(APP.loadState === 'error'){
    cls += ' err'; text = 'Load failed'; tip = 'Portal data could not be loaded — reload the page.';
  } else if(APP.loadState !== 'ready'){
    text = 'Loading'; tip = 'Loading portal data';
  } else if(APP.config && APP.config.lastRecalc){
    cls += ' green'; text = 'Recalculated';
    tip = 'Output last recalculated ' + APP.config.lastRecalc;
  } else {
    cls += ' amber'; text = 'Not recalculated';
    tip = 'Output has never been recalculated.';
  }
  el.className = cls; el.textContent = text; el.title = tip;
  fitNav();   /* the chip's width changes how much room the tab row has */
}

/* run(fnName, args, onOk, onErr, isWrite) - wraps google.script.run */
function run(fn, args, onOk, onErr, isWrite){
  if(isWrite){ _inFlight++; setSave('busy'); }
  let chain = google.script.run
    .withSuccessHandler(resp => {
      if(isWrite){ _inFlight--; if(_inFlight<=0){ _inFlight=0; setSave('ok'); } }
      if(onOk) onOk(resp);
    })
    .withFailureHandler(err => {
      const m = (err && err.message) ? err.message : String(err);
      if(isWrite){ _inFlight--; if(_inFlight<=0){ _inFlight=0; setSave('err', m); } }
      if(onErr) onErr(err); else showError('Failed: '+m);
    });
  chain[fn].apply(chain, args||[]);
}
window.addEventListener('beforeunload', e => { if(_inFlight>0){ e.preventDefault(); e.returnValue=''; } });

/* ============================ boot ============================ */
window.onload = function(){
  run('initApp', [], d => {
    document.getElementById('boot').style.display='none';
    if(!d.authorised){
      document.getElementById('unauthEmail').textContent = d.email || '(unknown)';
      document.getElementById('unauth').style.display='block';
      APP.loadState='unauth'; setSave('ok');
      return;
    }
    APP.user=d.user; APP.ref=d.ref; APP.config=d.config;
    const who=document.getElementById('who');
    who.innerHTML='<span class="avatar" id="whoAvatar"></span>';
    const av=document.getElementById('whoAvatar');
    av.textContent=initialsOf(d.user.portalName);
    av.title=d.user.portalName+' · '+d.user.role;
    buildTabPanes(); renderNav();
    document.getElementById('app').style.display='block';
    switchTab('dashboard');
    run('loadAllAppData', [], d2 => {
      Object.assign(APP, {rates:d2.rates, compMix:d2.compMix, ccMix:d2.ccMix, fx:d2.fx,
                          output:d2.output, validation:d2.validation||[],
                          completeness:d2.completeness, config:d2.config});
      if(d2.audit) APP.audit=d2.audit;
      APP.loadState='ready';
      renderActive(); renderStatusChip();
    }, err => { APP.loadState='error'; renderActive(); renderStatusChip(); showError('Load failed: '+err.message); });
  }, err => { document.getElementById('boot').textContent='Failed to start: '+err.message; });
};

function isAdmin(){ return APP.user && APP.user.role==='Admin'; }
function isEditor(){ return APP.user && (APP.user.role==='Editor'||APP.user.role==='Admin'); }

/** "Tash Lado" -> "TL", with the full name and role on hover. */
function initialsOf(name){
  const parts = String(name||'').trim().split(/\s+/).filter(Boolean);
  if(!parts.length) return '?';
  if(parts.length === 1) return parts[0].slice(0,2).toUpperCase();
  return (parts[0].charAt(0)+parts[parts.length-1].charAt(0)).toUpperCase();
}

  APP.activeTab=tab;
  closeNavMenu(); renderNav();
  document.querySelectorAll('.screen').forEach(p => p.classList.toggle('on', p.id==='pane-'+tab));
  renderActive();
}
/* Hide tabs into More until the row stops overflowing. Measured rather than
   guessed at a breakpoint, because the room available depends on the status
   chip, whose width changes with its text. */
function fitNav(){
  const n=document.getElementById('nav'), more=document.getElementById('navMore'),
        menu=document.getElementById('navMenu');
  if(!n || !more || !menu) return;
  const tabs = Array.from(n.querySelectorAll('button[data-s]'));
  tabs.forEach(b => b.hidden=false);
  more.hidden=true; n.classList.remove('scrolls');
  if(n.scrollWidth <= n.clientWidth){ closeNavMenu(); menu.innerHTML=''; return; }

  more.hidden=false;                 /* More itself takes room — reveal before measuring */
  const moved=[];
  for(let i=tabs.length-1; i>=0 && n.scrollWidth>n.clientWidth; i--){
    if(NAV_ALWAYS.indexOf(tabs[i].getAttribute('data-s'))>=0) continue;
    tabs[i].hidden=true;
    moved.unshift(tabs[i].getAttribute('data-s'));
  }
  if(!moved.length){
    more.hidden=true; closeNavMenu(); menu.innerHTML='';
    if(n.scrollWidth>n.clientWidth) n.classList.add('scrolls');
    return;
  }
  const labels={}; navTabs().forEach(t => labels[t.id]=t.label);
  menu.innerHTML = moved.map(k =>
    '<button data-ms="'+k+'" class="'+(APP.activeTab===k?'on':'')+'">'+esc(labels[k]||k)+'</button>').join('');
  menu.querySelectorAll('button[data-ms]').forEach(b => {
    b.onclick = e => { e.stopPropagation(); switchTab(b.getAttribute('data-ms')); };
  });
  /* The active tab may be one of the collapsed ones — More carries the highlight. */
  const mb=document.getElementById('navMoreBtn');
  if(mb) mb.className = (moved.indexOf(APP.activeTab)>=0) ? 'on' : '';
  if(n.scrollWidth>n.clientWidth) n.classList.add('scrolls');
}
function toggleNavMenu(){
  const menu=document.getElementById('navMenu'), mb=document.getElementById('navMoreBtn');
  if(!menu) return;
  const open = menu.hidden;
  menu.hidden = !open;
  if(mb) mb.setAttribute('aria-expanded', open?'true':'false');
}
function closeNavMenu(){
  const menu=document.getElementById('navMenu'), mb=document.getElementById('navMoreBtn');
  if(menu) menu.hidden=true;
  if(mb) mb.setAttribute('aria-expanded','false');
}
document.addEventListener('click', closeNavMenu);

  clearTimeout(window._navFit);
  window._navFit = setTimeout(fitNav, 80);

/* A message in the page, not a corner toast — a failed save must leave a trace
   where the user is looking. */
function flash(cls, msg, ms){
  const host = document.querySelector('.screen.on');
  if(!host) return alert(msg);
  const b=document.createElement('div'); b.className=cls; b.textContent=msg;
  host.insertBefore(b, host.firstChild);
  setTimeout(()=>{ if(b.parentNode) b.parentNode.removeChild(b); }, ms);
}
function showError(msg){ flash('err-box', msg, 9000); }
function showOk(msg){ flash('ok-box', msg, 4000); }
/* Kept so every call site reads the same either way. */
function toast(msg, kind){ (kind==='danger'?showError:showOk)(msg); }

/* ============================= modal ============================= */
let _theModal=null;
function closeModal(){
  if(_theModal){
    /* The resize listener is on window, so it outlives the overlay unless it is
       taken off here — one leaked listener per modal opened otherwise. */
    if(_theModal.ckReplace) window.removeEventListener('resize', _theModal.ckReplace);
    if(_theModal.el && _theModal.el.parentNode) _theModal.el.parentNode.removeChild(_theModal.el);
  }
  _theModal=null;
  document.onkeydown=null;
}
/* Returns {hide} so call sites read the same as they did under Bootstrap. */
function modal(title, bodyHtml, footHtml, wide){
  closeModal();
  const back=document.createElement('div');
  back.className='back';
  back.innerHTML='<div class="modal'+(wide?' wide':'')+'" role="dialog" aria-modal="true">'+
    '<h3>'+esc(title)+'</h3>'+
    '<div class="mbody"><div class="fields">'+bodyHtml+'</div></div>'+
    '<div class="acts">'+(footHtml||'')+'</div></div>';
  document.body.appendChild(back);
  /* A fixed dropdown panel does not travel with the form it belongs to, so it is
     re-placed when either scroller moves or the window changes size. Cheap, and
     the alternative — closing on scroll — throws away a half-made selection to a
     stray trackpad nudge. */
  const ckReplace = () => back.querySelectorAll('.checks.open').forEach(ckPlace);
  _theModal={ el:back, hide:closeModal, ckReplace:ckReplace };
  back.addEventListener('scroll', ckReplace);
  const mbody = back.querySelector('.mbody');
  if(mbody) mbody.addEventListener('scroll', ckReplace);
  window.addEventListener('resize', ckReplace);
  back.onclick = e => {
    if(e.target===back) return closeModal();
    /* A click in the form that is not inside a dropdown shuts the open one, which
       is what a dropdown is expected to do and the reason the panel needs no
       scrim of its own. A tick box is inside .checks — the panel is still a DOM
       child of it, fixed positioning notwithstanding — so ticking a value does
       not close the list you are ticking it in. */
    if(!(e.target.closest && e.target.closest('.checks'))) ckCloseAll(back);
  };
  document.onkeydown = e => {
    if(e.key!=='Escape') return;
    /* Escape shuts an open dropdown first and the modal only when none is open,
       so it cannot throw away a part-filled bulk change because a panel happened
       to be showing. */
    if(ckCloseAll(back)) return;
    closeModal();
  };
  const first=back.querySelector('.fields input:not([disabled]), .fields select');
  if(first) first.focus();
  return _theModal;
}

function saveRateFromModal(rateId){
  const payload={ rateId:rateId, modellingId:v('rm_line'), ccFlag:v('rm_cc'), customerType:v('rm_ct'),
    fromDate:v('rm_from'), toDate:v('rm_to'), cpu:v('rm_cpu'), qty:v('rm_qty'), comment:v('rm_com') };
  let item=null, original=null;
  if(rateId){
    item=APP.rates.find(x=>String(x.Rate_ID)===String(rateId));
    original=Object.assign({},item);
    Object.assign(item,{Modelling_ID:Number(payload.modellingId),CC_Flag:payload.ccFlag,Customer_Type:payload.customerType,
      From_Date:payload.fromDate,To_Date:payload.toDate,CPU:Number(payload.cpu),QTY:Number(payload.qty),Comment:payload.comment});
  } else {
    item={Rate_ID:-Date.now(),Modelling_ID:Number(payload.modellingId),CC_Flag:payload.ccFlag,Customer_Type:payload.customerType,
      From_Date:payload.fromDate,To_Date:payload.toDate,CPU:Number(payload.cpu),QTY:Number(payload.qty),
      Comment:payload.comment,Active:'Y',_optimistic:true};
    APP.rates.unshift(item);
  }
  closeModal(); renderRates(); showOk('Saved');
  run('saveRate',[payload], resp=>{
    if(!rateId && item){ item.Rate_ID=resp.rateId; delete item._optimistic; renderRates(); }
  }, err=>{
    if(rateId && original) Object.assign(item,original);
    else APP.rates=APP.rates.filter(x=>x!==item);
    renderRates(); showError(err.message);
  }, true);
}
function delRate(rateId){
  if(!confirm('Deactivate rate #'+rateId+'? It stays in the history.')) return;
  const removed=APP.rates.find(x=>String(x.Rate_ID)===String(rateId));
  APP.rates=APP.rates.filter(x=>x!==removed);
  renderRates(); showOk('Deleted');
  run('deleteRate',[rateId], null, err=>{
    APP.rates.unshift(removed); renderRates(); showError(err.message);
  }, true);
}

/* ====================== bulk rate update ======================
   The filters at the top of this screen narrow what you are looking at. This
   changes a set of rates in one go, chosen by dimension rather than by picking
   rows: tick the component whose cost moved, leave brand and geo alone, and
   every rate under it moves.

   Every dimension opens with all of its values ticked, and unticking narrows
   that dimension only. Values inside one dimension are ORed; the dimensions are
   ANDed with each other. Fully ticked reaches the server as the empty selection,
   never a magic 'ALL' string — a component actually named ALL is one data entry
   away, and a wildcard a data entry can impersonate is a wildcard waiting to
   widen somebody's price change.

   Nothing is written until the preview is confirmed, and confirming sends back
   the planKey the preview issued, so it can only ever apply the set it showed. */
const BULK_DIMS = [
  {key:'highLevelComponent', label:'High Level Component'},
  {key:'component',          label:'Component'},
  {key:'brand',              label:'Brand'},
  {key:'geo',                label:'Geo'},
  {key:'treatmentType',      label:'Treatment type'},
  {key:'wlDetail',           label:'WL detail'},
  {key:'ccFlag',             label:'CC flag'},
  {key:'customerType',       label:'Customer type'}
];
let BULKOPTS=null;

function openBulkRates(){
  if(BULKOPTS) return bulkForm();
  run('bulkRateOptions',[],o=>{ BULKOPTS=o; bulkForm(); }, err=>showError(err.message));
}
/* A closed control that says "All 5" or "3 of 5", and a floating panel that opens
   on click. data-dim stays on the group and the values stay ordinary checkboxes
   inside it, so bulkRead's contract with the server is untouched: fully ticked
   still leaves as [], anything else as a list. Only the presentation moved. */
function bulkChecks(d, keep, open){
  const opts=(BULKOPTS[d.key]||[]);
  const prior=keep && keep[d.key];
  const on=v=>!prior || !prior.length || prior.indexOf(v)>=0;
  const nOn=opts.filter(on).length;
  return '<div class="field w2">'+
    '<div class="checks'+(open?' open':'')+'" data-dim="'+d.key+'">'+
    '<button type="button" class="cksum" aria-expanded="'+(open?'true':'false')+'" '+
      'onclick="bulkToggle(\''+d.key+'\')">'+
      '<span>'+esc(d.label)+'</span>'+
      '<span class="cnt" id="bcnt_'+d.key+'">'+
        (nOn===opts.length?'All '+opts.length:nOn+' of '+opts.length)+'</span>'+
      '<span class="chev">&#9662;</span></button>'+
    '<div class="ckpanel">'+
      '<div class="cacts">'+
        '<button type="button" onclick="bulkSetAll(\''+d.key+'\',true)">All</button>'+
        '<button type="button" onclick="bulkSetAll(\''+d.key+'\',false)">None</button></div>'+
      '<div class="clist">'+
      (opts.length?opts.map(v=>'<label><input type="checkbox" value="'+esc(v)+'"'+
        (on(v)?' checked':'')+' onchange="bulkCount()">'+esc(v)+'</label>').join('')
       :'<span class="muted small">none defined</span>')+
      '</div></div></div></div>';
}
/* Put an open panel where its control is, in viewport coordinates — needed
   because the panel is position:fixed to escape the form's two clips. Flips above
   the control when there is more room there, so the last dimension in a scrolled
   form does not open into nothing. */
function ckPlace(group){
  const btn=group.querySelector('.cksum'), panel=group.querySelector('.ckpanel');
  if(!btn||!panel) return;
  const r=btn.getBoundingClientRect();
  panel.style.width=r.width+'px';
  panel.style.left=r.left+'px';
  /* Measured after .open is set, so offsetHeight is the height it will render at. */
  const ph=panel.offsetHeight, room=window.innerHeight-r.bottom-8;
  panel.style.top=(ph>room && r.top-8>room ? r.top-ph-4 : r.bottom+4)+'px';
}
/* Shut every open dropdown under root. Returns whether it shut anything, so
   Escape can tell "closed a panel" from "nothing was open". */
function ckCloseAll(root, except){
  let shut=false;
  root.querySelectorAll('.checks.open').forEach(g=>{
    if(g===except) return;
    g.classList.remove('open');
    const b=g.querySelector('.cksum');
    if(b) b.setAttribute('aria-expanded','false');
    shut=true;
  });
  return shut;
}
/* One panel open at a time: two floating over each other is a stack of tick boxes
   with no way to tell which dimension you are narrowing. */
function bulkToggle(key){
  const back=_theModal && _theModal.el; if(!back) return;
  const group=back.querySelector('.checks[data-dim="'+key+'"]'); if(!group) return;
  const wasOpen=group.classList.contains('open');
  ckCloseAll(back, group);
  group.classList.toggle('open', !wasOpen);
  const btn=group.querySelector('.cksum');
  if(btn) btn.setAttribute('aria-expanded', wasOpen?'false':'true');
  if(!wasOpen) ckPlace(group);
}
function bulkSetAll(key, state){
  document.querySelectorAll('[data-dim="'+key+'"] input[type=checkbox]')
    .forEach(cb => cb.checked=state);
  bulkCount();
}
function bulkCount(){
  BULK_DIMS.forEach(d=>{
    const el=document.getElementById('bcnt_'+d.key); if(!el) return;
    const group=el.closest('.checks');
    const all=document.querySelectorAll('[data-dim="'+d.key+'"] input[type=checkbox]');
    const on=Array.from(all).filter(cb=>cb.checked).length;
    el.textContent = on===all.length ? 'All '+all.length : on+' of '+all.length;
    if(group) group.classList.toggle('none', all.length>0 && on===0);
  });
}
/* Fully ticked → [] ("all"); nothing ticked → null, which the caller rejects. */
function bulkRead(key){
  const all=Array.from(document.querySelectorAll('[data-dim="'+key+'"] input[type=checkbox]'));
  if(!all.length) return [];
  const on=all.filter(cb=>cb.checked).map(cb=>cb.value);
  if(!on.length) return null;
  return on.length===all.length ? [] : on;
}
function bulkForm(keep){
  const k=keep||{};
  const today=new Date().toISOString().slice(0,10);
  const from=k.fromDate || (today>APP.config.horizonStart?today:APP.config.horizonStart);
  /* Coming back from a preview, one narrowed dimension opens itself — the one the
     user is most likely to be adjusting. Only the first: eight panels floating at
     once is the wall of tick boxes the dropdown replaced, and every closed control
     already reads "3 of 5" without being opened. */
  const narrowed=BULK_DIMS.filter(d=>k[d.key] && k[d.key].length).map(d=>d.key);
  const openKey=narrowed.length?narrowed[0]:null;
  /* The change first, the scope second: what you are doing belongs above the fold. */
  modal('Bulk update rates',
    '<div class="merr" id="bkErr" style="display:none"></div>'+
    '<div class="fgrid">'+
    mselect('bk_field','Change which figure',k.field||'CPU',['CPU','QTY'],1)+
    mselect('bk_mode','How',k.mode==='PCT'?'Uplift by %':'Set to',['Set to','Uplift by %'],1)+
    mfield('bk_value','Value',k.value===undefined?'':k.value,2,'number','any')+
    mfield('bk_from','Effective from',from,1,'date')+
    mfield('bk_to','Until',k.toDate||APP.config.horizonEnd,1,'date')+
    mfield('bk_com','Where it came from',k.comment||'',2)+
    '<div class="w4 hint">Whatever period is running on each matching rate is shortened to the day '+
      'before the effective date. The note is written to every row this changes, with the batch '+
      'reference.</div>'+
    '</div>'+
    '<div class="fsplit">Which rates<span>every rate matching all eight moves — fully ticked '+
      'means no narrowing on that dimension</span></div>'+
    '<div class="fgrid">'+BULK_DIMS.map(d=>bulkChecks(d,k,openKey===d.key)).join('')+'</div>',
    '<button class="btn" onclick="closeModal()">Cancel</button>'+
    '<button class="btn primary" id="bkPrev" onclick="bulkPreview()">Preview</button>',
    true);
  bulkCount();
  /* A panel rendered .open still has no position — it is fixed, so nothing places
     it but ckPlace, and it can only be measured once it is in the document. */
  if(_theModal) _theModal.el.querySelectorAll('.checks.open').forEach(ckPlace);
}
/* The bulk form stays open when it refuses, so its complaint has to be inside it. */
function bulkFail(msg){
  const el=document.getElementById('bkErr');
  if(!el) return showError(msg);
  el.style.display='block'; el.textContent=msg;
  el.scrollIntoView({block:'nearest'});
}
function bulkRequest(){
  const el=document.getElementById('bkErr'); if(el) el.style.display='none';
  const dims={}, empty=[];
  BULK_DIMS.forEach(d=>{
    const sel=bulkRead(d.key);
    if(sel===null) empty.push(d.label);
    else dims[d.key]=sel;
  });
  if(empty.length){
    bulkFail('Nothing is ticked under: '+empty.join(', ')+'. Tick at least one value, '+
             'or use All to leave that dimension unnarrowed.');
    return null;
  }
  return { dimensions:dims, field:v('bk_field'),
           mode:v('bk_mode')==='Uplift by %'?'PCT':'SET',
           value:Number(v('bk_value')), fromDate:v('bk_from'), toDate:v('bk_to'),
           comment:v('bk_com'), preview:true };
}
function bulkPreview(){
  const req=bulkRequest();
  if(!req) return;
  const raw={ field:req.field, mode:req.mode, value:v('bk_value'), fromDate:req.fromDate,
              toDate:req.toDate, comment:req.comment };
  BULK_DIMS.forEach(d=>raw[d.key]=req.dimensions[d.key]);
  const b=document.getElementById('bkPrev');
  b.disabled=true; b.innerHTML='<span class="spinner"></span>Checking…';
  run('bulkUpdateRates',[req], pv=>{ closeModal(); bulkConfirm(req, pv, raw); },
    err=>{ b.disabled=false; b.textContent='Preview'; bulkFail(err.message); });
}
/* The preview, and the only place a write can be authorised. */
function bulkConfirm(req, pv, raw){
  const dp = pv.field==='QTY' ? 2 : 4;
  const money = n => num(n, dp);
  const skipped = pv.skippedNoRate+pv.skippedBlocked+pv.skippedNoScope;

  if(!pv.count){
    modal('Nothing matches',
      '<p class="muted" style="margin:0 0 12px">That selection matches no existing rate to '+
      'supersede.</p>'+
      '<table class="kv"><tbody>'+
      '<tr><td>Lines matching the dimensions</td><td class="num">'+pv.linesMatched+'</td></tr>'+
      '<tr><td>…with no rate to supersede</td><td class="num">'+pv.skippedNoRate+'</td></tr>'+
      '<tr><td>…blocked by a later rate</td><td class="num">'+pv.skippedBlocked+'</td></tr>'+
      '<tr><td>…outside the areas you can edit</td><td class="num">'+pv.skippedNoScope+'</td></tr>'+
      '</tbody></table>'+
      '<div class="warn-box" style="margin:14px 0 0">A bulk update only ever changes rates that '+
      'already exist. It will not create one for a line that has none — that gap is worth seeing '+
      'here rather than being filled in silently.</div>',
      '<button class="btn" onclick="closeModal()">Close</button>'+
      '<button class="btn primary" onclick="bulkBack()">Change the selection</button>');
    BULKKEEP=raw;
    return;
  }

  const word = pv.count===1 ? '1 rate' : pv.count+' rates';
  let b='<table class="kv"><tbody>'+
    '<tr><td>Rates to be superseded</td><td class="num"><strong>'+pv.count+'</strong></td></tr>'+
    '<tr><td>'+(pv.mode==='PCT'?'Moving by':'New '+pv.field+' on every one')+'</td>'+
    '<td class="num"><strong>'+(pv.mode==='PCT'
      ? (pv.value>=0?'+':'')+esc(String(pv.value))+'%'
      : esc(money(pv.value)))+'</strong></td></tr>'+
    '<tr><td>Effective</td><td class="num">'+esc(pv.fromDate)+' to '+esc(pv.toDate)+'</td></tr>'+
    '</tbody></table>';

  b+='<div style="margin-top:14px"><table><thead><tr><th>Now</th><th>Becomes</th>'+
     '<th class="right">Rates</th></tr></thead><tbody>'+
     pv.distinct.map(d=>'<tr><td class="num">'+esc(money(d.was))+'</td>'+
       '<td class="num">'+esc(money(d.now))+'</td>'+
       '<td class="right num">'+d.rows+'</td></tr>').join('')+
     '</tbody></table></div>';

  if(pv.mode==='SET' && pv.distinct.length>1){
    b+='<div class="warn-box" style="margin-top:14px">These rates are not all the same today. '+
       'Applying this flattens '+pv.distinct.length+' different values to one. If that is not '+
       'what you meant, narrow the selection.</div>';
  }
  if(pv.revisions){
    b+='<div class="warn-box" style="margin-top:14px">'+pv.revisions+' of them already start on '+
       esc(pv.fromDate)+', so those periods are revised in place rather than superseded.</div>';
  }
  if(skipped){
    b+='<div class="warn-box" style="margin-top:14px">Also matching the dimensions but left '+
       'alone: '+pv.skippedNoRate+' with no rate to supersede, '+pv.skippedBlocked+
       ' blocked by a later rate'+
       (pv.blockedExamples&&pv.blockedExamples.length?' ('+esc(pv.blockedExamples.join(', '))+')':'')+
       ', '+pv.skippedNoScope+' outside the areas you can edit.</div>';
  }

  b+='<div style="margin-top:14px"><table><thead><tr><th>#</th><th>Line</th><th>CC</th>'+
     '<th>Type</th><th class="right">Now</th><th class="right">Becomes</th></tr></thead><tbody>'+
     pv.sample.map(s=>'<tr><td class="num">'+s.rateId+'</td><td>'+esc(s.label)+'</td>'+
       '<td>'+esc(s.ccFlag)+'</td><td>'+esc(s.customerType)+'</td>'+
       '<td class="right num">'+esc(money(s.was))+'</td>'+
       '<td class="right num">'+esc(money(s.now))+'</td></tr>').join('')+
     '</tbody></table>'+
     (pv.count>pv.sample.length
       ? '<div class="hint">Showing '+pv.sample.length+' of '+pv.count+'.</div>' : '')+
     '</div>'+
     '<div class="hint" style="margin-top:10px">Selection — '+esc(pv.selection)+'</div>';

  BULKKEEP=raw;
  modal('Apply to '+word+'?', b,
    '<div class="lead muted">This is real pricing data — read the numbers before confirming.</div>'+
    '<button class="btn" onclick="bulkBack()">Back</button>'+
    '<button class="btn primary" id="bkApply" onclick="bulkApply()">Apply to '+word+'</button>',
    true);
  BULKAPPLY={ req:req, planKey:pv.planKey, word:word };
}
let BULKKEEP=null, BULKAPPLY=null;
function bulkBack(){ closeModal(); bulkForm(BULKKEEP); }
function bulkApply(){
  const b=document.getElementById('bkApply');
  b.disabled=true; b.innerHTML='<span class="spinner"></span>Applying…';
  const apply=Object.assign({}, BULKAPPLY.req, {preview:false, planKey:BULKAPPLY.planKey});
  run('bulkUpdateRates',[apply], res=>{
    closeModal();
    showOk(res.written+' rate(s) updated as batch '+res.batchRef+' — '+res.rowsClosed+
           ' period(s) closed, '+res.rowsCreated+' created'+
           (res.rowsRevised?', '+res.rowsRevised+' revised in place':'')+
           '. Recalculate to see it in Output.');
    run('loadAllAppData',[],d2=>{
      Object.assign(APP,{rates:d2.rates, completeness:d2.completeness, config:d2.config});
      if(d2.audit) APP.audit=d2.audit;
      renderActive();
    });
  }, err=>{ b.disabled=false; b.textContent='Apply to '+BULKAPPLY.word; showError(err.message); },
  true);
}

/* ========================= component mix ========================= */
function mixGroups(){
  const groups={};
  APP.ref.lines.forEach(l=>{
    if(String(l.Active).toUpperCase()==='N') return;
    const c=compById(l.Component_ID); if(!c) return;
    const key=l.High_Level_ID+'||'+c.High_Level_Component;
    (groups[key]=groups[key]||{hlId:l.High_Level_ID,hlComponent:c.High_Level_Component,lines:[]}).lines.push(l);
  });
  return groups;
}
function renderCompMix(){
  if(notReady('compmix')) return;
  const groups=mixGroups();
  const activeMix=APP.compMix.filter(m=>String(m.Active).toUpperCase()!=='N');
  const byLine={};
  activeMix.forEach(m=>{ (byLine[m.Modelling_ID]=byLine[m.Modelling_ID]||[]).push(m); });
  const rows=Object.values(groups).sort((a,b)=>a.hlId-b.hlId||a.hlComponent.localeCompare(b.hlComponent)).map(g=>{
    const h=hlById(g.hlId);
    const mixRows=g.lines.flatMap(l=>byLine[l.Modelling_ID]||[]);
    const split=g.lines.length>1;
    let status;
    if(mixRows.length){
      const anyMix=mixRows.some(m=>Number(m.Mix)>0);
      status=anyMix
        ? '<span class="pill">'+(split?'split across '+g.lines.length
            :'attach up to '+Math.round(mixRows.reduce((t,m)=>Math.max(t,Number(m.Mix)),0)*100)+'%')+'</span>'
        : '<span class="badge">off</span>';
    } else status='<span class="badge amber">no mix rows</span>';
    return '<tr class="click" data-hl="'+g.hlId+'" data-comp="'+esc(g.hlComponent)+'">'+
      '<td>'+esc(hlLabel(h))+'</td><td>'+esc(g.hlComponent)+'</td>'+
      '<td class="num">'+g.lines.length+'</td><td class="num">'+mixRows.length+'</td><td>'+status+'</td></tr>';
  }).join('');
  pane('compmix').innerHTML=
    '<div class="card"><h2>Component mix groups</h2>'+
    '<div class="note small muted" style="padding:10px 16px 0">Click a group to view or edit its mix rows. '+
      'A split across multiple components must total 100% per date range — the portal blocks saves that do not.</div>'+
    '<div class="tablewrap"><table><thead><tr><th>High Level ID</th><th>High Level Component</th>'+
    '<th class="right">Lines</th><th class="right">Mix rows</th><th>Status</th></tr></thead>'+
    '<tbody>'+rows+'</tbody></table></div></div>';
  pane('compmix').querySelectorAll('tr.click').forEach(tr=>{
    tr.onclick=()=>openMixGroup(tr.dataset.hl, tr.dataset.comp);
  });
}
let MIXEDIT=null;
function openMixGroup(hlId, hlComponent){
  const g=mixGroups()[hlId+'||'+hlComponent];
  if(!g) return;
  MIXEDIT={hlId:hlId, hlComponent:hlComponent, rows:[]};
  const lineIds=g.lines.map(l=>String(l.Modelling_ID));
  APP.compMix.forEach(m=>{
    if(String(m.Active).toUpperCase()==='N') return;
    if(lineIds.indexOf(String(m.Modelling_ID))<0) return;
    MIXEDIT.rows.push({mixId:m.Mix_ID, modellingId:m.Modelling_ID, fromDate:m.From_Date, toDate:m.To_Date,
                       mix:Number(m.Mix), comment:m.Comment, deleted:false});
  });
  modal('Component mix — '+hlLabel(hlById(hlId))+' / '+hlComponent,
    '<div id="mixBody"></div>',
    '<div class="lead" id="mixSum"></div>'+
    '<button class="btn" onclick="mixAddRow()">Add row</button>'+
    '<button class="btn" onclick="closeModal()">Cancel</button>'+
    (isEditor()?'<button class="btn primary" id="mixSaveBtn" onclick="saveMixGroup()">Save group</button>':''),
    true);
  renderMixEditor();
}
function renderMixEditor(){
  const g=mixGroups()[MIXEDIT.hlId+'||'+MIXEDIT.hlComponent];
  const lineOpts=g.lines.map(l=>{
    const c=compById(l.Component_ID);

  });
  document.getElementById('mixBody').innerHTML=

    '<th>Mix (0–1)</th><th>Comment</th><th></th></tr></thead><tbody>'+
    MIXEDIT.rows.map((r,i)=> r.deleted?'' :
      '<tr>'+
      '<td style="min-width:185px"><select onchange="MIXEDIT.rows['+i+'].modellingId=this.value">'+
        lineOpts.map(o=>'<option value="'+o.id+'"'+(String(r.modellingId)===String(o.id)?' selected':'')+'>'+
          esc(o.label)+'</option>').join('')+'</select></td>'+

      '<td><input type="date" value="'+esc(r.toDate)+'" onchange="MIXEDIT.rows['+i+'].toDate=this.value;mixSumPreview()"></td>'+
      '<td style="min-width:96px"><input type="number" step="any" min="0" max="1" value="'+r.mix+
        '" oninput="MIXEDIT.rows['+i+'].mix=Number(this.value);mixSumPreview()"></td>'+
      '<td><input type="text" value="'+esc(r.comment)+'" onchange="MIXEDIT.rows['+i+'].comment=this.value"></td>'+
      '<td class="rowacts"><button class="btn link danger" onclick="MIXEDIT.rows['+i+'].deleted=true;renderMixEditor()">Remove</button></td>'+
      '</tr>').join('')+
    '</tbody></table></div>';
  mixSumPreview();
}
function mixAddRow(){
  const g=mixGroups()[MIXEDIT.hlId+'||'+MIXEDIT.hlComponent];
  MIXEDIT.rows.push({mixId:null, modellingId:g.lines[0].Modelling_ID,
    fromDate:APP.config.horizonStart, toDate:APP.config.horizonEnd, mix:1, comment:'', deleted:false});
  renderMixEditor();
}
function mixSumPreview(){
  const act=MIXEDIT.rows.filter(r=>!r.deleted);
  const el=document.getElementById('mixSum'); if(!el) return;
  if(!act.length){ el.innerHTML='<span class="muted">No active rows — component will be off.</span>'; return; }
  const starts=[...new Set(act.map(r=>r.fromDate))].sort();
  el.innerHTML=starts.map(s=>{
    const covering=act.filter(r=>r.fromDate<=s && r.toDate>=s);
    const sum=covering.reduce((t,r)=>t+(Number(r.mix)||0),0);
    const nz=covering.filter(r=>Number(r.mix)>0).length;
    const ok = nz<2 || Math.abs(sum-1)<=0.0005;
    return '<span class="'+(ok?'mix-sum-ok':'mix-sum-bad')+'">'+esc(s)+': '+(sum*100).toFixed(1)+'%</span>';
  }).join('');
}
function saveMixGroup(){
  const btn=document.getElementById('mixSaveBtn');
  btn.disabled=true; btn.textContent='Saving…';
  run('saveComponentMixGroup',[{highLevelId:MIXEDIT.hlId, hlComponent:MIXEDIT.hlComponent, rows:MIXEDIT.rows}],
    ()=>{
      closeModal(); showOk('Mix group saved');
      run('loadAllAppData',[],d2=>{ Object.assign(APP,{compMix:d2.compMix,completeness:d2.completeness}); renderActive(); });
    },
    err=>{ btn.disabled=false; btn.textContent='Save group'; showError(err.message); },
    true);
}

function saveCCFromModal(id){
  const payload={ccMixId:id, highLevelId:v('cc_hl'), fromDate:v('cc_from'), toDate:v('cc_to'), mix:v('cc_mix'), comment:v('cc_com')};
  let item=null, original=null;
  if(id){
    item=APP.ccMix.find(x=>String(x.CC_Mix_ID)===String(id));
    original=Object.assign({},item);
    Object.assign(item,{High_Level_ID:Number(payload.highLevelId),From_Date:payload.fromDate,To_Date:payload.toDate,
      CC_Mix:Number(payload.mix),Comment:payload.comment});
  } else {
    item={CC_Mix_ID:-Date.now(),High_Level_ID:Number(payload.highLevelId),From_Date:payload.fromDate,
      To_Date:payload.toDate,CC_Mix:Number(payload.mix),Comment:payload.comment,Active:'Y',_optimistic:true};
    APP.ccMix.unshift(item);
  }
  closeModal(); renderCCMix(); showOk('Saved');
  run('saveCCMix',[payload], resp=>{
    if(!id && item){ item.CC_Mix_ID=resp.ccMixId; delete item._optimistic; renderCCMix(); }
  }, err=>{
    if(id && original) Object.assign(item,original);
    else APP.ccMix=APP.ccMix.filter(x=>x!==item);
    renderCCMix(); showError(err.message);
  }, true);
}
function delCC(id){
  if(!confirm('Deactivate cold chain range #'+id+'?')) return;
  const removed=APP.ccMix.find(x=>String(x.CC_Mix_ID)===String(id));
  APP.ccMix=APP.ccMix.filter(x=>x!==removed);
  renderCCMix(); showOk('Deleted');
  run('deleteCCMix',[id], null, err=>{ APP.ccMix.unshift(removed); renderCCMix(); showError(err.message); }, true);
}

    '<th class="right">Cost (local)</th><th class="right">Cost (GBP)</th><th class="right">Snapshot</th>'+
    '<th class="right">Variance</th></tr></thead><tbody>'+
    (shown.length?shown.map(r=>'<tr><td class="num">'+r.High_Level_ID+'</td>'+
      '<td>'+esc(String(r.Month).slice(0,7))+'</td><td>'+esc(r.Customer_Type)+'</td>'+
      '<td>'+esc(r.Brand)+'</td><td>'+esc(r.Geo)+'</td><td>'+esc(r.Treatment_Type)+'</td>'+
      '<td>'+esc(r.WL_Detail)+'</td><td>'+esc(r.Currency)+'</td>'+
      '<td class="right num">'+num(r.Cost_Local)+'</td><td class="right num">'+num(r.Cost_GBP)+'</td>'+
      '<td class="right num">'+num(r.Snapshot_Cost_Local)+'</td>'+
      '<td class="right num '+(Number(r.Variance_Local)>0.0001?'up':Number(r.Variance_Local)<-0.0001?'down':'')+'">'+
        num(r.Variance_Local)+'</td></tr>').join('')
     :'<tr><td colspan="12" class="muted">Nothing to show — recalculate, or widen the filters.</td></tr>')+
    '</tbody></table></div>'+
    '<div class="note small muted" style="padding:8px 16px">'+rows.length+' rows'+
      (rows.length>shown.length?' (showing first '+shown.length+')':'')+'</div></div>';
}
function doRecalc(){
  const b=document.getElementById('recalcBtn');
  b.disabled=true; b.innerHTML='<span class="spinner"></span>Recalculating…';
  run('recalculate',[], resp=>{
    /* A refusal is a successful call that wrote nothing, not a failure. It has to
       land somewhere the user cannot walk past, because the numbers on screen are
       still the old ones and nothing else on the page would say so. */
    if(resp.blocked){ recalcBlocked(resp); return; }
    showOk('Recalculated '+resp.lines+' lines × '+resp.months+' months');
    refreshAfterRecalc();
  }, err=>{ b.disabled=false; b.textContent='Recalculate'; showError(err.message); }, true);
}
function refreshAfterRecalc(){
  run('loadAllAppData',[],d2=>{
    Object.assign(APP,{output:d2.output, validation:d2.validation||[],
                       config:d2.config, completeness:d2.completeness});
    renderActive(); renderStatusChip();
  });
}
function recalcBlocked(resp){
  const val=resp.validation||{counts:{ERROR:0,WARN:0,INFO:0}, findings:[]};
  const errs=(val.findings||[]).filter(f=>String(f.severity).toUpperCase()==='ERROR');
  modal('Recalculation stopped — '+val.counts.ERROR+' error(s)',
    '<div class="err-box" style="margin:0 0 14px">Nothing was written. Modelling and Output still '+
    'hold the numbers from the last good recalculation.</div>'+
    '<p class="muted small" style="margin:0 0 12px">These are the checks that say the forecast '+
    'would be wrong — a component that ships with nothing to price it, or a split that does not '+
    'total 100%. Fix them and run again. If the forecast is genuinely meant to publish over the '+
    'top of them, set the Config key <b>VALIDATION_BLOCKS_RECALC</b> to <b>FALSE</b>.</p>'+
    '<div class="tablewrap"><table><thead><tr><th>Rule</th><th>Line</th><th>What was found</th>'+
    '</tr></thead><tbody>'+
    errs.slice(0,25).map(f=>'<tr><td>'+esc(f.rule)+'</td><td class="num">'+esc(f.modellingId)+'</td>'+
      '<td>'+esc(f.message)+'</td></tr>').join('')+
    '</tbody></table></div>'+
    (errs.length>25?'<div class="hint">Showing 25 of '+errs.length+'.</div>':'')+
    (val.counts.WARN?'<div class="hint" style="margin-top:10px">'+val.counts.WARN+
      ' warning(s) were also raised — they do not block anything.</div>':''),
    '<button class="btn" onclick="closeModal()">Close</button>'+
    '<button class="btn primary" onclick="closeModal();switchTab(\'validation\')">Open Validation</button>',
    true);
  refreshAfterRecalc();
}
function doSnapshot(){
  const name=prompt('Name this snapshot (e.g. "RFQ4 2026 final"):');
  if(!name) return;
  run('createSnapshot',[name], resp=>{
    APP.ref.snapshots.push(resp.name);
    showOk('Snapshot "'+resp.name+'" saved ('+resp.rows+' rows)');
    renderOutput();
  }, null, true);
}
function changeCompareSnapshot(name){
  const clean=name==='(none)'?'':name;
  run('setCompareSnapshot',[clean], resp=>{
    APP.config.compareSnapshot=resp.compareSnapshot;
    showOk('Comparison set to '+(clean||'none')+' — hit Recalculate to refresh the variance columns');
  }, null, true);
}


/* ========================== validation ==========================
   The rule pack's findings, read from the Validation_Results tab. Re-running
   recomputes them server side; the counts here are only ever as fresh as the
   last run, which is why the last-run stamp sits beside them rather than being
   left to be inferred from an empty table. */
const SEV_ORDER = {ERROR:0, WARN:1, INFO:2};
function validationCounts(){
  const c={ERROR:0, WARN:0, INFO:0};
  (APP.validation||[]).forEach(r=>{
    const sev=String(r.Severity||'').toUpperCase();
    if(c[sev]!==undefined) c[sev]++;
  });
  return c;
}
function sevBadge(sev){
  const s=String(sev||'').toUpperCase();
  const cls = s==='ERROR' ? 'badge err' : s==='WARN' ? 'badge amber' : 'badge';
  return '<span class="'+cls+'">'+esc(s||'—')+'</span>';
}
/* Ranks the whole line, not just the number: an ERROR count of zero is the good
   news the dashboard exists to give, and dressing it in red would bury it. */
function validationSummaryCard(){
  const c=validationCounts();
  const ran=APP.config.lastValidation||'';
  const stat=(label,n,cls)=>
    '<div style="min-width:96px"><div class="small muted">'+label+'</div>'+
    '<div class="stat num'+(cls?' '+cls:'')+'">'+n+'</div></div>';
  let note='';
  if(!ran){
    note='<div class="note small muted" style="padding:10px 0 0">Validation has not been run yet — '+
         'open the Validation tab and hit Re-run.</div>';
  } else if(c.ERROR && APP.config.validationBlocksRecalc){
    note='<div class="warn-box" style="margin:12px 0 0">'+c.ERROR+' error(s) are blocking '+
         'recalculation — Output keeps the last good numbers until they are fixed.</div>';
  } else if(c.ERROR){
    note='<div class="warn-box" style="margin:12px 0 0">'+c.ERROR+' error(s) outstanding. '+
         'VALIDATION_BLOCKS_RECALC is set to FALSE, so recalculation writes anyway.</div>';
  }
  return '<div class="card"><h2>Validation'+
    '<span class="act"><button class="btn sm" onclick="switchTab(\'validation\')">Open</button></span></h2>'+
    '<div class="body"><div class="row tight" style="gap:28px;align-items:flex-start">'+
    stat('Errors', c.ERROR, c.ERROR?'up':'')+
    stat('Warnings', c.WARN)+
    stat('Notes', c.INFO)+
    '<div class="spacer"></div>'+
    '<div><div class="small muted">Last run</div>'+
      '<div class="stat sm">'+esc(ran||'Never')+'</div></div>'+
    '</div>'+note+'</div></div>';
}

function renderValidation(){
  if(notReady('validation')) return;
  const c=validationCounts();
  const f=APP.filters;
  const all=(APP.validation||[]).slice().sort((a,b)=>
    (SEV_ORDER[String(a.Severity).toUpperCase()]||3)-(SEV_ORDER[String(b.Severity).toUpperCase()]||3) ||
    String(a.Rule_Code).localeCompare(String(b.Rule_Code)));
  const rules=[...new Set(all.map(r=>String(r.Rule_Code)).filter(Boolean))].sort();
  let rows=all;
  if(f.valSeverity) rows=rows.filter(r=>String(r.Severity).toUpperCase()===f.valSeverity);
  if(f.valRule) rows=rows.filter(r=>String(r.Rule_Code)===f.valRule);
  const shown=rows.slice(0,600);

  pane('validation').innerHTML=
    '<div class="card"><div class="body"><div class="row tight">'+
    '<div class="field filter"><label>Severity</label>'+
      '<select onchange="APP.filters.valSeverity=this.value;renderValidation()">'+
      '<option value="">All severities</option>'+selOptions(f.valSeverity,['ERROR','WARN','INFO'])+
      '</select></div>'+
    '<div class="field filter"><label>Rule</label>'+
      '<select onchange="APP.filters.valRule=this.value;renderValidation()">'+
      '<option value="">All rules</option>'+selOptions(f.valRule,rules)+'</select></div>'+
    '<div class="spacer"></div>'+
    '<div class="field filter"><label>Counts</label><div style="padding-top:5px">'+
      sevBadge('ERROR')+' '+c.ERROR+' &nbsp; '+sevBadge('WARN')+' '+c.WARN+
      ' &nbsp; '+sevBadge('INFO')+' '+c.INFO+'</div></div>'+
    (isEditor()?'<button class="btn primary" id="valRunBtn" onclick="doValidate()">Re-run</button>':'')+
    '</div>'+
    '<div class="hint">Last run: '+esc(APP.config.lastValidation||'never')+
      ' — errors block Recalculate unless the Config key VALIDATION_BLOCKS_RECALC is set to FALSE.</div>'+
    '</div></div>'+
    '<div class="card"><div class="tablewrap"><table><thead><tr>'+
    '<th>Severity</th><th>Rule</th><th>HL</th><th>Line</th><th>Month</th><th>What was found</th>'+
    '</tr></thead><tbody>'+
    (shown.length?shown.map(r=>'<tr>'+
      '<td>'+sevBadge(r.Severity)+'</td><td>'+esc(r.Rule_Code)+'</td>'+
      '<td class="num">'+esc(r.High_Level_ID)+'</td><td class="num">'+esc(r.Modelling_ID)+'</td>'+
      '<td>'+esc(String(r.Month||'').slice(0,7))+'</td>'+
      '<td>'+esc(r.Message)+'</td></tr>').join('')
     :'<tr><td colspan="6" class="muted">'+
        (APP.config.lastValidation
          ? (all.length?'Nothing matches these filters.':'No problems found at the last run.')
          : 'Validation has not been run yet.')+
      '</td></tr>')+
    '</tbody></table></div>'+
    '<div class="note small muted" style="padding:8px 16px">'+rows.length+' finding(s)'+
      (rows.length>shown.length?' (showing first '+shown.length+')':'')+
      ' — the full set is on the Validation_Results tab of the Google Sheet.</div></div>';
}

function doValidate(){
  const b=document.getElementById('valRunBtn');
  if(b){ b.disabled=true; b.innerHTML='<span class="spinner"></span>Checking…'; }
  run('runValidation',[], rep=>{
    showOk('Validation '+rep.status+' — '+rep.counts.ERROR+' error(s), '+rep.counts.WARN+
           ' warning(s), '+rep.counts.INFO+' note(s).');
    run('loadAllAppData',[],d2=>{
      Object.assign(APP,{validation:d2.validation||[], config:d2.config});
      renderActive(); renderStatusChip();
    });
  }, err=>{
    if(b){ b.disabled=false; b.textContent='Re-run'; }
    showError(err.message);
  }, true);
}

/* ========================== lookups ========================== */
function renderDims(){
  if(!isAdmin()){ pane('dims').innerHTML='<div class="card"><div class="empty">Admins only.</div></div>'; return; }
  const hl=APP.ref.highLevelIds, cp=APP.ref.components, ln=APP.ref.lines, ar=APP.ref.areas;
  pane('dims').innerHTML=
  '<div class="grid2">'+
  '<div class="card"><h2>High Level IDs<span class="act">'+
    '<button class="btn sm" onclick="editHL(null)">Add</button></span></h2>'+
    '<div class="scrollbox tablewrap"><table><thead><tr><th>ID</th><th>Brand</th><th>Geo</th><th>Treat</th>'+
    '<th>Detail</th><th>Ccy</th><th>Act</th><th></th></tr></thead><tbody>'+
    hl.map(h=>'<tr><td class="num">'+h.High_Level_ID+'</td><td>'+esc(h.Brand)+'</td><td>'+esc(h.Geo)+'</td>'+
      '<td>'+esc(h.Treatment_Type)+'</td><td>'+esc(h.WL_Detail)+'</td><td>'+esc(h.Currency)+'</td>'+
      '<td>'+esc(h.Active)+'</td><td class="rowacts"><button class="btn link" onclick="editHL('+h.High_Level_ID+')">Edit</button></td>'+
      '</tr>').join('')+'</tbody></table></div></div>'+
  '<div class="card"><h2>Components<span class="act">'+
    '<button class="btn sm" onclick="editComp(null)">Add</button></span></h2>'+
    '<div class="scrollbox tablewrap"><table><thead><tr><th>ID</th><th>High Level Component</th><th>Component</th>'+
    '<th>Act</th><th></th></tr></thead><tbody>'+
    cp.map(c=>'<tr><td class="num">'+c.Component_ID+'</td><td>'+esc(c.High_Level_Component)+'</td>'+
      '<td>'+esc(c.Component)+'</td><td>'+esc(c.Active)+'</td>'+
      '<td class="rowacts"><button class="btn link" onclick="editComp('+c.Component_ID+')">Edit</button></td>'+
      '</tr>').join('')+'</tbody></table></div></div>'+
  '<div class="card"><h2>Modelling Lines<span class="act">'+
    '<button class="btn sm" onclick="editLine(null)">Add</button></span></h2>'+
    '<div class="scrollbox tablewrap"><table><thead><tr><th>ID</th><th>High Level</th><th>Component</th>'+
    '<th>Act</th><th></th></tr></thead><tbody>'+
    ln.map(l=>{const c=compById(l.Component_ID);
      return '<tr><td class="num">'+l.Modelling_ID+'</td><td>'+esc(hlLabel(hlById(l.High_Level_ID)))+'</td>'+
      '<td>'+esc(c?c.Component:'?')+'</td><td>'+esc(l.Active)+'</td>'+
      '<td class="rowacts"><button class="btn link" onclick="editLine('+l.Modelling_ID+')">Edit</button></td></tr>';
    }).join('')+'</tbody></table></div></div>'+
  '<div class="card"><h2>Modelling Areas<span class="act">'+
    '<button class="btn sm" onclick="editArea(null)">Add</button></span></h2>'+
    '<div class="tablewrap"><table><thead><tr><th>ID</th><th>Name</th><th>Customer types</th><th>Act</th><th></th>'+
    '</tr></thead><tbody>'+
    ar.map(a=>'<tr><td class="num">'+a.Area_ID+'</td><td>'+esc(a.Area_Name)+'</td>'+
      '<td>'+esc(a.Customer_Types)+'</td><td>'+esc(a.Active)+'</td>'+
      '<td class="rowacts"><button class="btn link" onclick="editArea('+a.Area_ID+')">Edit</button></td>'+
      '</tr>').join('')+'</tbody></table></div>'+
    '<div class="note small muted" style="padding:10px 16px">To add a future breakdown (e.g. Mounjaro Bundles): '+
      'add a High Level ID with the new WL Detail, then add its Modelling Lines here. The Dashboard will flag '+
      'the missing rates and mixes to fill in.</div></div>'+
  '</div>';
}
function reloadRefAfterDim(){
  run('initApp',[],d=>{ APP.ref=d.ref; APP.config=d.config; renderActive(); });
}
function activeSelect(id, val){
  return '<div class="field w1"><label for="'+id+'">Active</label><select id="'+id+'">'+
    '<option>Y</option><option'+(val==='N'?' selected':'')+'>N</option></select></div>';
}
function editHL(id){
  const h=id?APP.ref.highLevelIds.find(x=>String(x.High_Level_ID)===String(id)):{};
  modal(id?'Edit High Level ID '+id:'Add High Level ID',
    '<div class="fgrid">'+
    mfield('h_brand','Brand',h.Brand,2)+mfield('h_geo','Geo (GB/US/DE/CA)',h.Geo,2)+
    mfield('h_treat','Treatment Type',h.Treatment_Type,2)+mfield('h_detail','WL Detail',h.WL_Detail,2)+
    mfield('h_ccy','Currency',h.Currency||'GBP',1)+activeSelect('h_active',h.Active)+
    mfield('h_comment','Comment',h.Comment,2)+
    '</div>',
    modalActs('submitHL('+(id||'null')+')'));
}
function submitHL(id){
  run('saveHighLevelId',[{id:id,areaId:1,brand:v('h_brand'),geo:v('h_geo'),treatmentType:v('h_treat'),
    wlDetail:v('h_detail'),currency:v('h_ccy'),active:v('h_active'),comment:v('h_comment')}],
    ()=>{ closeModal(); showOk('Saved'); reloadRefAfterDim(); }, err=>showError(err.message), true);
}
function editComp(id){
  const c=id?APP.ref.components.find(x=>String(x.Component_ID)===String(id)):{};
  modal(id?'Edit component '+id:'Add component',
    '<div class="fgrid">'+
    mfield('c_hlc','High Level Component',c.High_Level_Component,2)+mfield('c_name','Component',c.Component,2)+
    mfield('c_comment','Comment',c.Comment,3)+activeSelect('c_active',c.Active)+
    '</div>',
    modalActs('submitComp('+(id||'null')+')'));
}
function submitComp(id){
  run('saveComponent',[{id:id,areaId:1,highLevelComponent:v('c_hlc'),component:v('c_name'),
    active:v('c_active'),comment:v('c_comment')}],
    ()=>{ closeModal(); showOk('Saved'); reloadRefAfterDim(); }, err=>showError(err.message), true);
}
function editLine(id){
  const l=id?APP.ref.lines.find(x=>String(x.Modelling_ID)===String(id)):{};
  const hlOpts=APP.ref.highLevelIds.map(h=>'<option value="'+h.High_Level_ID+'"'+
    (l.High_Level_ID==h.High_Level_ID?' selected':'')+'>'+esc(h.High_Level_ID+' — '+hlLabel(h))+'</option>').join('');
  const cpOpts=APP.ref.components.map(c=>'<option value="'+c.Component_ID+'"'+
    (l.Component_ID==c.Component_ID?' selected':'')+'>'+esc(c.High_Level_Component+' / '+c.Component)+'</option>').join('');
  modal(id?'Edit line '+id:'Add modelling line',
    '<div class="fgrid">'+
    mselectRaw('l_hl','High Level ID',hlOpts,2)+mselectRaw('l_cp','Component',cpOpts,2)+
    mfield('l_comment','Comment',l.Comment,3)+activeSelect('l_active',l.Active)+
    '</div>',
    modalActs('submitLine('+(id||'null')+')'));
}
function submitLine(id){
  run('saveLine',[{id:id,highLevelId:v('l_hl'),componentId:v('l_cp'),active:v('l_active'),comment:v('l_comment')}],
    ()=>{ closeModal(); showOk('Saved'); reloadRefAfterDim(); }, err=>showError(err.message), true);
}
function editArea(id){
  const a=id?APP.ref.areas.find(x=>String(x.Area_ID)===String(id)):{};
  modal(id?'Edit area '+id:'Add area',
    '<div class="fgrid">'+
    mfield('a_name','Area name',a.Area_Name,2)+mfield('a_metric','Output metric name',a.Output_Metric_Name,2)+
    mfield('a_types','Customer types (CSV)',a.Customer_Types||'New,Repeat,OTC',3)+activeSelect('a_active',a.Active)+
    '</div>',
    modalActs('submitArea('+(id||'null')+')'));
}
function submitArea(id){
  run('saveArea',[{id:id,areaName:v('a_name'),outputMetricName:v('a_metric'),
    customerTypes:v('a_types'),active:v('a_active')}],
    ()=>{ closeModal(); showOk('Saved'); reloadRefAfterDim(); }, err=>showError(err.message), true);
}

/* =========================== history =========================== */
function renderHistory(){
  if(!isAdmin()){ pane('history').innerHTML='<div class="card"><div class="empty">Admins only.</div></div>'; return; }
  if(notReady('history')) return;
  const a=APP.audit||[];
  pane('history').innerHTML='<div class="card"><h2>Recent activity</h2>'+
    '<div class="note small muted" style="padding:10px 16px 0">Last '+a.length+' actions. '+
      'Full row-level snapshots live in the *_Amends tabs of the Google Sheet.</div>'+
    '<div class="tablewrap"><table><thead><tr>'+
    '<th>When</th><th>Who</th><th>Action</th><th>Table</th><th>Target</th><th>Summary</th></tr></thead><tbody>'+
    (a.length?a.map(r=>'<tr><td>'+esc(String(r.Timestamp))+'</td><td>'+esc(r.Email)+'</td>'+
      '<td>'+esc(r.Action)+'</td><td>'+esc(r.Target_Table)+'</td><td>'+esc(r.Target_ID)+'</td>'+
      '<td>'+esc(r.Summary)+'</td></tr>').join('')
     :'<tr><td colspan="6" class="muted">No activity logged yet.</td></tr>')+
    '</tbody></table></div></div>';
}
